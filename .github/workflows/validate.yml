name: Validate integration

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: [self-hosted, Linux, X64]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -q
  hassfest:
    runs-on: [self-hosted, Linux, X64]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: Run Hassfest without Docker
        run: |
          core=$(mktemp -d)
          trap 'rm -rf "$core"' EXIT
          curl --fail --silent --show-error --location \
            https://codeload.github.com/home-assistant/core/tar.gz/refs/tags/2026.10.2 \
            | tar -xz --strip-components=1 -C "$core"
          python -m venv "$core/.venv"
          "$core/.venv/bin/python" -m pip install \
            -r "$core/requirements.txt" \
            -c "$core/homeassistant/package_constraints.txt" \
            $(grep -E '^(pipdeptree|tqdm)==' "$core/requirements_test.txt") \
            $(grep -E '^ruff==' "$core/requirements_test_pre_commit.txt")
          cd "$core"
          .venv/bin/python -m script.hassfest --action validate \
            --integration-path "$GITHUB_WORKSPACE/custom_components/china_broadnet"
  hacs:
    # The official validator rejects private repositories before checking files.
    if: ${{ !github.event.repository.private }}
    runs-on: [self-hosted, Linux, X64]
    steps:
      - uses: actions/checkout@v6
      - uses: hacs/action@main
        with:
          category: integration
          comment: "false"
