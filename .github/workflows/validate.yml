name: Validate integration

on:
  # Self-hosted jobs run only for branches pushed to this repository.
  push:
    branches: [main, "feature/**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: [self-hosted, Linux, X64]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2
        with:
          version: "0.12.23"
      - name: Run Ruff and pytest
        run: |
          uv venv .venv
          uv pip install --python .venv/bin/python -r requirements-dev.txt
          .venv/bin/ruff check .
          .venv/bin/ruff format --check .
          .venv/bin/python -m pytest -q
      - name: Run HACS validation without Docker
        if: ${{ !github.event.repository.private }}
        shell: bash
        env:
          INPUT_CATEGORY: integration
          INPUT_GITHUB_TOKEN: ${{ github.token }}
          REPOSITORY_REF: ${{ github.ref_name }}
        run: |
          hacs=$(mktemp -d)
          trap 'rm -rf "$hacs"' EXIT
          curl --fail --silent --show-error --location \
            https://codeload.github.com/hacs/integration/tar.gz/a15e87ec0d1c82e58f1ddbaf17669d3eaa261eb8 \
            | tar -xz --strip-components=1 -C "$hacs"
          PYTHONPATH="$hacs" .venv/bin/python "$hacs/action/action.py"
  hassfest:
    runs-on: [self-hosted, Linux, X64]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2
        with:
          version: "0.12.23"
      - name: Run Hassfest without Docker
        shell: bash
        run: |
          core=$(mktemp -d)
          trap 'rm -rf "$core"' EXIT
          curl --fail --silent --show-error --location \
            https://codeload.github.com/home-assistant/core/tar.gz/refs/tags/2026.10.2 \
            | tar -xz --strip-components=1 -C "$core"
          uv venv "$core/.venv"
          uv pip install --python "$core/.venv/bin/python" \
            -r "$core/requirements.txt" \
            -c "$core/homeassistant/package_constraints.txt" \
            $(grep -E '^(pipdeptree|tqdm)==' "$core/requirements_test.txt") \
            $(grep -E '^ruff==' "$core/requirements_test_pre_commit.txt")
          source "$core/.venv/bin/activate"
          cd "$core"
          python -m script.hassfest --action validate \
            --integration-path "$GITHUB_WORKSPACE/custom_components/china_broadnet"
