name: Release integration

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: [self-hosted, Linux, X64]
    steps:
      - uses: actions/checkout@v6
      - name: Verify manifest version matches tag
        shell: bash
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          manifest_version=$(python3 -c 'import json; print(json.load(open("custom_components/china_broadnet/manifest.json"))["version"])')
          if [ "$tag_version" != "$manifest_version" ]; then
            echo "Tag version ($tag_version) does not match manifest.json ($manifest_version)" >&2
            exit 1
          fi
      - name: Create GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists."
            exit 0
          fi

          notes=$(python3 - "$GITHUB_REF_NAME" <<'PY'
          import re
          import sys
          from pathlib import Path

          version = sys.argv[1].lstrip("v")
          text = Path("CHANGELOG.md").read_text(encoding="utf-8")
          pattern = rf"^## \[{re.escape(version)}\][^\n]*\n+(.*?)(?=^## \[|\Z)"
          match = re.search(pattern, text, flags=re.MULTILINE | re.DOTALL)
          print(match.group(1).strip() if match else "")
          PY
          )

          title="China Broadnet for Home Assistant $GITHUB_REF_NAME"
          if [ -n "$notes" ]; then
            gh release create "$GITHUB_REF_NAME" --title "$title" --notes "$notes"
          else
            gh release create "$GITHUB_REF_NAME" --title "$title" --generate-notes
          fi
